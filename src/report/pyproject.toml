[project]
name = "report"
version = "0.1.0"
description = "Renders the cross-bookmaker odds comparison as a static HTML page."
requires-python = ">=3.13"
dependencies = [
    "core",
    "jinja2>=3.1.6",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.406",
    "pytest>=9.0.2",
]

[tool.uv]
package = false

[tool.uv.sources]
core = { path = "../core", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["."]
# `core` is installed editable; pyright cannot follow setuptools' editable
# finder, so it reads the source tree directly.
extraPaths = ["../core"]
exclude = ["**/__pycache__", ".venv"]
