[project]
name = "core"
version = "0.1.0"
description = "Shared data models, arbitrage math and scraper runtime for the swiss-sports-bet services."
readme = "README.md"
authors = [
    { name = "tremgan", email = "tregan.remi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "rich>=14.3.3",
    "sqlmodel>=0.0.37",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools.package-data]
core = ["py.typed"]

[dependency-groups]
dev = [
    "pyright>=1.1.406",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["core", "tests"]
