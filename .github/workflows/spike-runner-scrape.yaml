# THROWAWAY SPIKE. Delete once the question is answered.
#
# Question: can both scrapers reach their sources from a GitHub-hosted runner?
# Loro is a plain REST call; Swisslos drives headless Chromium against a Swiss
# lottery operator, so a datacenter IP in a US Azure region is the thing that
# might get challenged or geo-blocked. Nothing is written anywhere: each job
# parses and prints counts.

name: Spike - runner scrape

on:
  workflow_dispatch:

jobs:
  where-am-i:
    runs-on: ubuntu-latest
    steps:
      - name: Runner location
        run: curl -s https://ipinfo.io/json

  loro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: src/loro_scrape_service
        run: uv sync

      - name: Scrape and report
        working-directory: src/loro_scrape_service
        run: |
          uv run python - <<'PY'
          import main
          from core.scraper import build_session

          pairs = main.scrape(build_session())
          print(f"LORO: parsed {len(pairs)} pairs")
          for match, odds in pairs[:5]:
              print(
                  f"  {match.match_datetime}  {match.match_label}  "
                  f"{odds.team1_odds}/{odds.draw_odds}/{odds.team2_odds}"
              )
          if not pairs:
              raise SystemExit("LORO: no pairs parsed")
          PY

  swisslos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: src/swisslos_scrape_service
        run: uv sync

      - name: Install Chromium
        working-directory: src/swisslos_scrape_service
        run: uv run playwright install chromium --with-deps

      - name: Scrape and report
        working-directory: src/swisslos_scrape_service
        run: |
          uv run python - <<'PY'
          import main

          messages = main.collect_messages()
          print(f"SWISSLOS: collected {len(messages)} websocket frames")

          pairs = main.parse_messages(messages)
          print(f"SWISSLOS: parsed {len(pairs)} pairs")
          for match, odds in pairs[:5]:
              print(
                  f"  {match.match_datetime}  {match.match_label}  "
                  f"{odds.team1_odds}/{odds.draw_odds}/{odds.team2_odds}"
              )
          if not pairs:
              raise SystemExit("SWISSLOS: no pairs parsed")
          PY
