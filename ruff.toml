line-length = 88
target-version = "py313"

# Each service is its own uv project, so local modules live one level deep.
src = [
    "src/core",
    "src/db_service",
    "src/loro_scrape_service",
    "src/swisslos_scrape_service",
    "src/dashboard",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # bugbear
]

[lint.isort]
# `core` is a local path dependency, not a third-party package.
known-first-party = ["core"]

[lint.per-file-ignores]
# Alembic generates these; not worth fighting the template.
"src/db_service/migrations/*" = ["E501", "I001", "W291", "W293"]
