name: Test

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # ruff resolves no imports, so one pass from the root covers every service.
      - name: Ruff check
        run: uv tool run ruff check .

      - name: Ruff format
        run: uv tool run ruff format --check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service:
          - core
          - db_service
          - loro_scrape_service
          - swisslos_scrape_service
          - report

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check for tests folder
        id: check_tests
        run: |
          if [ -d "src/${{ matrix.service }}/tests" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: src/${{ matrix.service }}
        run: uv sync

      # pyright runs per service because it needs that service's own venv to
      # resolve sqlmodel and fastapi.
      - name: Type check
        working-directory: src/${{ matrix.service }}
        run: uv run pyright

      - name: Run tests
        if: steps.check_tests.outputs.has_tests == 'true'
        working-directory: src/${{ matrix.service }}
        run: uv run pytest
