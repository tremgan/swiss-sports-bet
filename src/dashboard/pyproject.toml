[project]
name = "dashboard"
version = "0.1.0"
description = "Streamlit dashboard comparing cross-bookmaker odds and flagging arbitrage opportunities."
requires-python = ">=3.13"
dependencies = [
    "core",
    "pandas>=2.3.3",
    "pytz>=2026.1.post1",
    "requests>=2.32.5",
    "streamlit>=1.55.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.406",
    "pytest>=9.0.2",
]

[tool.uv]
package = false

[tool.uv.sources]
core = { path = "../core", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["."]
# `core` is installed editable; pyright cannot follow setuptools' editable
# finder, so it reads the source tree directly.
extraPaths = ["../core"]
exclude = ["**/__pycache__", ".venv"]
